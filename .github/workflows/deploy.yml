name: Deploy to VPS

# Auto-deploy on push to main. The build runs on the VPS itself
# (docker compose up --build) to match the repo's self-hosted setup.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Never let two deploys overlap on the same server.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ~/mathverse
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
